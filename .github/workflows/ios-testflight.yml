name: Upload iOS to TestFlight

on:
  push:
    branches: [develop]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ethica-testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/develop'
    runs-on: macos-26
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      BUILD_NUMBER: 1.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and install iOS provider configuration
        env:
          IOS_CLIENT_CONFIG_JSON: ${{ secrets.IOS_CLIENT_CONFIG_JSON }}
        run: python3 ios/ci/prepare-client-config.py
      - name: Install signing credentials and validate profiles
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 ios/ci/prepare-signing.py
      - name: Verify App Store Connect authentication and app record
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node ios/ci/asc.cjs check
      - name: Archive signed app and widget
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project ios/Ethica.xcodeproj -scheme Ethica \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ethica-build" \
            -archivePath "$RUNNER_TEMP/Ethica.xcarchive" \
            -onlyUsePackageVersionsFromResolvedFile \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive \
            > "$RUNNER_TEMP/ethica-archive.log" 2>&1 || {
              tail -n 100 "$RUNNER_TEMP/ethica-archive.log"; exit 1;
            }
          codesign --verify --deep --strict "$RUNNER_TEMP/Ethica.xcarchive/Products/Applications/Ethica.app"
          echo "Signed archive completed: $BUILD_NUMBER"
      - name: Verify provider settings in the signed archive
        env:
          IOS_CLIENT_CONFIG_JSON: ${{ secrets.IOS_CLIENT_CONFIG_JSON }}
        run: python3 ios/ci/prepare-client-config.py --verify-app "$RUNNER_TEMP/Ethica.xcarchive/Products/Applications/Ethica.app"
      - name: Export installable distribution package
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Ethica.xcarchive" \
            -exportPath "$RUNNER_TEMP/ethica-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ethica-signing/ExportOptions.plist" \
            > "$RUNNER_TEMP/ethica-export.log" 2>&1 || {
              tail -n 80 "$RUNNER_TEMP/ethica-export.log"; exit 1;
            }
          test -f "$RUNNER_TEMP/ethica-export/Ethica.ipa"
      - name: Upload to App Store Connect only (no review submission)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/ethica-signing"
          xcrun altool --upload-app --type ios --file "$RUNNER_TEMP/ethica-export/Ethica.ipa" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded version 1.0 build $BUILD_NUMBER. No App Review submission." >> "$GITHUB_STEP_SUMMARY"
      - name: Check Apple processing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node ios/ci/asc.cjs processing
      - name: Remove signing material
        if: always()
        run: python3 ios/ci/cleanup-signing.py
