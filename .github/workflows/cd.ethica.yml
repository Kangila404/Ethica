name: Deploy Ethica to TrueNAS

on:
  push:
    branches: [develop]
    paths:
      - 'server/**'
      - 'infra/**'
      - 'package*.json'
      - 'docker-compose.prod.yml'
      - '.dockerignore'
      - '.github/workflows/*.ethica.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ethica-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.ethica.yml

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ethica-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Connect to NAS network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: github-actions-ethica-cd
          ping: ${{ secrets.NAS_HOST }}
      - name: Deploy verified image
        shell: bash
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_APP_DIR: ${{ secrets.NAS_APP_DIR }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
          NAS_KNOWN_HOSTS: ${{ secrets.NAS_KNOWN_HOSTS }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/ethica-server@${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$NAS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]+$ ]]
          [[ "$NAS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$NAS_APP_DIR" =~ ^/mnt/[a-zA-Z0-9_./-]+/ethica$ ]]
          [[ "$NAS_APP_DIR" != *..* ]]
          test -n "$NAS_SSH_KEY"
          test -n "$NAS_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$NAS_SSH_KEY" > "$HOME/.ssh/ethica-nas"
          printf '%s\n' "$NAS_KNOWN_HOSTS" > "$HOME/.ssh/ethica-known-hosts"
          opts=(-i "$HOME/.ssh/ethica-nas" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/ethica-known-hosts")
          target="${NAS_USER}@${NAS_HOST}"
          ssh "${opts[@]}" "$target" "test -s '$NAS_APP_DIR/.env' && test -s '$NAS_APP_DIR/server.env' && mkdir -p '$NAS_APP_DIR/infra'"
          scp "${opts[@]}" docker-compose.prod.yml "$target:$NAS_APP_DIR/docker-compose.prod.yml"
          scp "${opts[@]}" infra/deploy.sh infra/backup.sh "$target:$NAS_APP_DIR/infra/"
          ssh "${opts[@]}" "$target" "bash '$NAS_APP_DIR/infra/deploy.sh' '$IMAGE'"
