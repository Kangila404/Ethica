services:
 mysql:
  image: mysql:8.0
  container_name: ethica-mysql
  restart: unless-stopped
  ports:
    - "3308:3306"
  environment:
    MYSQL_ROOT_PASSWORD: ethica
    MYSQL_DATABASE: ethica
    MYSQL_USER: ethica
    MYSQL_PASSWORD: ethica
    TZ: Asia/Seoul
  command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
  volumes:
      - ethica-mysql-data:/var/lib/mysql

volumes:
  ethica-mysql-data:
  