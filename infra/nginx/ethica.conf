server {
    listen 80;
    server_name ethica.kro.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ethica.kro.kr;

    ssl_certificate /etc/letsencrypt/live/ethica.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ethica.kro.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker DNS must be re-resolved after an API container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ethica_backend ethica-server:3000;
    client_max_body_size 9m;

    location / {
        proxy_pass http://$ethica_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
